spring:
  application:
    name: ${SPRING_APPLICATION_NAME:coworking}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  jwt:
    secret: ${APP_JWT_SECRET:YnJvd24gZm94IGp1bXBzIG92ZXIgbGF6eSBkb2dzIG1ha2VzIHZpYnJhbnQgcGM=}
    expiration: ${APP_JWT_EXPIRATION:86400000}
  timezone: ${APP_TIMEZONE:America/El_Salvador}

resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents,prometheus
  endpoint:
    health:
      show-details: always
  info:
    build:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}