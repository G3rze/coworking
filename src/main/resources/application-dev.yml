spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:coworking_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
  flyway:
    enabled: false
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=300s
  jackson:
    time-zone: ${APP_TIMEZONE:America/El_Salvador}

logging:
  level:
    com.gerson.coworking: DEBUG
    org.springframework.security: DEBUG